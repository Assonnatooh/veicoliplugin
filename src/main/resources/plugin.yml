name: VeicoliPlugin
version: 1.0.0
main: it.assonnatooh.veicoli.VeicoliPlugin
api-version: '1.21'
author: Assonnatooh
description: Garage e veicoli personalizzati per server Minecraft
commands:
  garage:
    description: Apre il tuo garage o quello di un player (staff)
    usage: /garage [nick]
  adminveicoli:
    description: Gestisce i veicoli nei garage
    usage: /adminveicoli <give|remove> <nick> <nome veicolo>
    permission: veicoliplugin.admin
permissions:
  veicoliplugin.admin:
    description: Gestisce i veicoli e i garage degli altri player
    default: op
